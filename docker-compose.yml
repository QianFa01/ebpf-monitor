version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: ["./ebpf-monitor-server", "--port", "8000", "--store-size", "10000"]

  # Agent must run on host with --privileged for eBPF access
  # sudo ./ebpf-monitor-agent -s http://<server-ip>:8000
